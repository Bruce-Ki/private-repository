<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合租生活管家</title>
  <!-- 自包含单文件版：CSS / Mock 数据 / 应用逻辑已全部内联，可单独部署 -->
  <style>
/* ============================================================
   合租生活管家 - 全局样式
   ============================================================ */
:root {
  --bg: #f3f5f9;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --text: #1f2937;
  --text-2: #4b5563;
  --muted: #8a94a6;
  --border: #e5e9f0;
  --primary: #0d9488;
  --primary-weak: #0d94881a;
  --danger: #e11d48;
  --danger-weak: #e11d481a;
  --warn: #d97706;
  --warn-weak: #d977061a;
  --ok: #059669;
  --ok-weak: #0596691a;
  --info: #6366f1;
  --info-weak: #6366f11a;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
  --sidebar-w: 232px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10141b;
    --panel: #1a212b;
    --panel-2: #202936;
    --text: #e5e9f0;
    --text-2: #c3cad6;
    --muted: #8a94a6;
    --border: #2a3442;
    --primary: #2dd4bf;
    --primary-weak: #2dd4bf22;
    --danger: #fb7185;
    --danger-weak: #fb718522;
    --warn: #fbbf24;
    --warn-weak: #fbbf2422;
    --ok: #34d399;
    --ok-weak: #34d39922;
    --info: #818cf8;
    --info-weak: #818cf822;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}

/* ---------------- 布局 ---------------- */
.layout { display: flex; min-height: 100vh; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.page { padding: 20px 24px 48px; max-width: 1200px; width: 100%; margin: 0 auto; }

/* ---------------- 侧边栏 ---------------- */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 18px 16px;
  font-size: 17px;
  font-weight: 700;
}
.logo-icon { font-size: 24px; }

.nav { display: flex; flex-direction: column; gap: 4px; padding: 8px 12px; flex: 1; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--text-2);
  text-decoration: none;
  font-weight: 500;
  transition: background .15s, color .15s;
  position: relative;
}
.nav-item:hover { background: var(--panel-2); color: var(--text); }
.nav-item.active { background: var(--primary-weak); color: var(--primary); font-weight: 600; }
.nav-icon { font-size: 17px; width: 22px; text-align: center; }

.nav-dot {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
}

.sidebar-footer { padding: 14px; border-top: 1px solid var(--border); display: grid; gap: 6px; }
.house-chip {
  font-size: 12px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text-2);
}
.demo-chip { font-size: 11px; color: var(--muted); text-align: center; }

/* ---------------- 顶栏 ---------------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar h1 { font-size: 18px; font-weight: 700; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.today-chip {
  font-size: 12px;
  color: var(--text-2);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 12px;
}
.user-chip { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.user-chip em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 12px; }

/* ---------------- 头像 / 成员 ---------------- */
.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 16px;
  flex-shrink: 0;
}
.avatar-lg { width: 40px; height: 40px; font-size: 21px; }

.member-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
}
.member-chip .avatar { width: 22px; height: 22px; font-size: 12px; }

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
}
.card-accent { border-left: 4px solid var(--primary); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-title-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
.card-foot { font-size: 12px; color: var(--muted); margin-top: 12px; }

.section-title { font-size: 15px; font-weight: 700; margin: 26px 2px 12px; }

.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; }

.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 4px; }
.stat-card { display: flex; gap: 14px; align-items: flex-start; padding: 16px; }
.stat-card.warn { border-left: 4px solid var(--warn); }
.stat-icon { font-size: 26px; line-height: 1.2; }
.stat-body { min-width: 0; }
.stat-label { font-size: 12px; color: var(--muted); }
.stat-value { font-size: 19px; font-weight: 700; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-sub { font-size: 12px; color: var(--text-2); }

/* ---------------- 首页 ---------------- */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  background: linear-gradient(120deg, var(--panel) 60%, var(--primary-weak));
}
.hero h2 { font-size: 20px; }
.hero-sub { color: var(--text-2); font-size: 13px; margin-top: 4px; }
.hero-sub code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
.hero-members { display: flex; gap: -8px; }
.hero-members .avatar { margin-left: -8px; border: 2px solid var(--panel); }
.hero-members .avatar:first-child { margin-left: 0; }

.module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.module-card { cursor: pointer; transition: transform .15s, box-shadow .15s; border-top: 3px solid var(--mc); }
.module-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16, 24, 40, .1); }
.module-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.module-head { display: flex; align-items: center; gap: 10px; }
.module-icon {
  width: 42px; height: 42px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px;
  background: color-mix(in srgb, var(--mc) 14%, transparent);
  border-radius: 12px;
}
.module-name { font-size: 15px; font-weight: 700; flex: 1; }
.module-arrow { color: var(--mc); font-size: 18px; font-weight: 700; }
.module-desc { color: var(--text-2); font-size: 13px; margin: 10px 0; min-height: 42px; }
.module-mini {
  font-size: 12px;
  color: var(--mc);
  background: color-mix(in srgb, var(--mc) 10%, transparent);
  border-radius: 8px;
  padding: 6px 10px;
  display: inline-block;
}

.activity-card { padding: 8px 20px; }
.activity-list { list-style: none; }
.activity-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--border);
}
.activity-list li:last-child { border-bottom: none; }
.activity-icon { font-size: 17px; }
.activity-text { flex: 1; color: var(--text-2); font-size: 13px; }
.activity-time { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ---------------- 徽章 / 标签 ---------------- */
.badge {
  display: inline-block;
  font-size: 12px;
  border-radius: 999px;
  padding: 2px 10px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-ok { background: var(--ok-weak); color: var(--ok); }
.badge-warn { background: var(--warn-weak); color: var(--warn); }
.badge-danger { background: var(--danger-weak); color: var(--danger); }
.badge-info { background: var(--info-weak); color: var(--info); }
.badge-today { background: var(--primary-weak); color: var(--primary); margin-left: 6px; }

.tag {
  display: inline-block;
  font-size: 11px;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0 6px;
  margin-left: 6px;
  vertical-align: middle;
}

.cat-badge {
  display: inline-block;
  font-size: 12px;
  color: var(--cc);
  background: color-mix(in srgb, var(--cc) 12%, transparent);
  border-radius: 6px;
  padding: 2px 8px;
  font-weight: 500;
}

.text-green { color: var(--ok); }
.text-red { color: var(--danger); }
.text-muted { color: var(--muted); }
.small { font-size: 12px; }

/* ---------------- 表格 ---------------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--panel-2); }
.td-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-date { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.td-note { max-width: 260px; }
.row-today td { background: var(--primary-weak); }
.empty { color: var(--muted); text-align: center; padding: 16px; list-style: none; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: filter .15s, background .15s;
  font-family: inherit;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { filter: brightness(.96); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text-2); }
.btn-outline:hover { background: var(--panel-2); }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn-block { width: 100%; margin-top: 12px; }

/* ---------------- 费用模块 ---------------- */
.balance-list, .settle-list { list-style: none; }
.balance-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--border);
}
.balance-row:last-child { border-bottom: none; }
.balance-name { flex: 1; font-weight: 500; }
.balance-amt { font-weight: 700; font-variant-numeric: tabular-nums; }

.settle-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
  flex-wrap: wrap;
}
.settle-row:last-of-type { border-bottom: none; }
.settle-arrow { color: var(--muted); }
.settle-amt { margin-left: auto; font-weight: 700; color: var(--danger); font-variant-numeric: tabular-nums; }

.expense-form { display: grid; gap: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--text-2); }
.field > span { font-weight: 500; }
.field-wide { grid-column: 1 / -1; }
.field input, .field select {
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 14px;
  font-family: inherit;
  width: 100%;
}
.field input:focus, .field select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }

.split-checks { display: flex; gap: 10px; flex-wrap: wrap; }
.check-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  border-radius: 999px;
  padding: 5px 12px 5px 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-2);
  user-select: none;
}
.check-chip:has(input:checked) { border-color: var(--primary); background: var(--primary-weak); color: var(--primary); font-weight: 600; }
.check-chip input { accent-color: var(--primary); }
.form-actions { display: flex; justify-content: flex-end; }

/* ---------------- 值日模块 ---------------- */
.chore-list { list-style: none; display: grid; gap: 8px; }
.chore-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  flex-wrap: wrap;
}
.chore-task { font-weight: 600; flex: 1; min-width: 90px; }
.chore-row .btn { margin-left: auto; }
.freq { display: block; font-size: 11px; color: var(--muted); }

.rotation { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.rot-item { display: inline-flex; align-items: center; gap: 6px; }
.rot-arrow { color: var(--muted); font-weight: 700; }
.rule-text { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }

.fair-stats { display: grid; gap: 8px; }
.fair-row { display: flex; align-items: center; gap: 10px; }
.fair-name { width: 42px; font-size: 13px; font-weight: 500; }
.fair-row .bar { flex: 1; }
.fair-num { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fair-num em { font-style: normal; }

.bar { height: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s; }
.bar-fill.ok { background: var(--ok); }
.bar-fill.warn { background: var(--warn); }

/* ---------------- 物品模块 ---------------- */
.alert {
  border-radius: var(--radius);
  padding: 12px 16px;
  font-size: 13px;
  margin-bottom: 16px;
  border: 1px solid;
}
.alert-warn { background: var(--warn-weak); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--text); }
.alert-ok { background: var(--ok-weak); border-color: color-mix(in srgb, var(--ok) 35%, transparent); color: var(--text); }

.item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.item-card { padding: 16px; display: grid; gap: 10px; }
.item-head { display: flex; align-items: center; gap: 10px; }
.item-icon {
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 21px;
  background: var(--panel-2);
  border-radius: 10px;
}
.item-title { flex: 1; min-width: 0; }
.item-name { font-weight: 700; }
.item-loc { font-size: 12px; color: var(--muted); }
.item-stock { font-size: 13px; color: var(--text-2); }
.item-stock b { font-size: 17px; color: var(--text); }
.item-actions { display: flex; gap: 8px; }
.item-actions .btn { flex: 1; }

/* ---------------- 公约模块 ---------------- */
.pact-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.pact-head h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }

.clause-list { list-style: none; display: grid; gap: 4px; counter-reset: none; }
.clause { padding: 10px 0; border-bottom: 1px dashed var(--border); }
.clause:last-child { border-bottom: none; }
.clause b { font-size: 14px; }
.clause p { color: var(--text-2); font-size: 13px; margin-top: 2px; }

.proposal-title { font-weight: 600; margin: 4px 0 2px; }
.vote-bar-wrap { margin: 12px 0; }
.vote-bar { height: 10px; border-radius: 999px; background: var(--danger-weak); overflow: hidden; }
.vote-for { height: 100%; background: var(--ok); border-radius: 999px; transition: width .3s; }
.vote-nums { display: flex; justify-content: space-between; font-size: 12px; margin-top: 6px; font-weight: 600; }
.vote-btns { display: flex; gap: 10px; }
.vote-btns .btn { flex: 1; }
.voted { font-size: 13px; color: var(--text-2); background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }

.sign-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sign-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
}
.sign-name { font-weight: 600; font-size: 13px; }
.sign-time { font-size: 11px; color: var(--muted); line-height: 1.5; }

.timeline { list-style: none; position: relative; padding-left: 18px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 5px; top: 6px; bottom: 6px;
  width: 2px;
  background: var(--border);
}
.timeline-item { position: relative; padding: 6px 0 14px; }
.timeline-item:last-child { padding-bottom: 2px; }
.timeline-dot {
  position: absolute;
  left: -18px; top: 12px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--panel);
  box-shadow: 0 0 0 2px var(--primary-weak);
}
.timeline-item b { font-size: 14px; }
.timeline-item p { color: var(--text-2); font-size: 13px; margin-top: 2px; }

/* ---------------- Toast ---------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translate(-50%, 20px);
  background: #1f2937;
  color: #fff;
  border-radius: 12px;
  padding: 10px 20px;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100;
  max-width: 86vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.warn { background: #92400e; }
.toast.err { background: #9f1239; }

/* ---------------- 响应式 ---------------- */
@media (max-width: 1080px) {
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .item-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .logo { padding: 12px 16px; }
  .nav { flex-direction: row; overflow-x: auto; padding: 4px 12px 10px; }
  .nav-item { white-space: nowrap; padding: 8px 12px; }
  .nav-dot { display: none; }
  .sidebar-footer { display: none; }
  .cols-2, .module-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .page { padding: 16px 14px 40px; }
  .topbar { padding: 12px 14px; }
  .today-chip { display: none; }
}

@media (max-width: 560px) {
  .stat-row, .item-grid, .sign-grid { grid-template-columns: 1fr; }
}
  </style>
</head>
<body>
  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">🏠</span>
        <span class="logo-text">合租生活管家</span>
      </div>
      <nav class="nav">
        <a class="nav-item" href="#/home" data-route="home">
          <span class="nav-icon">🏡</span><span>首页</span>
        </a>
        <a class="nav-item" href="#/expenses" data-route="expenses">
          <span class="nav-icon">💰</span><span>费用AA分摊</span>
        </a>
        <a class="nav-item" href="#/chores" data-route="chores">
          <span class="nav-icon">🧹</span><span>清洁值日排班</span>
        </a>
        <a class="nav-item" href="#/items" data-route="items">
          <span class="nav-icon">🧻</span><span>公共物品</span>
        </a>

/* ============================================================

const App = (() => {
  /* ---------------- 全局状态（内存态，刷新即重置） ---------------- */
  const state = {
    route: 'home',
    currentUserId: MOCK.currentUserId,
    expenses: MOCK.expenses.map(e => ({ ...e })),
    chores: MOCK.chores.map(c => ({ ...c })),

    activities: MOCK.activities.slice(),
    idSeq: 100,
  };

  const $ = sel => document.querySelector(sel);
  const me = () => memberById(state.currentUserId);
  const memberById = id => MOCK.members.find(m => m.id === id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtC = cents => '¥' + (Math.abs(cents) / 100).toFixed(2);
  const fmtA = a => '¥' + Number(a).toFixed(2);
  const avatar = (m, size = '') => `<span class="avatar ${size}" style="background:${m.color}26">${m.avatar}</span>`;
  const memberChip = id => { const m = memberById(id); return `<span class="member-chip">${avatar(m)}${m.name}</span>`; };

  const TITLES = {
    home: '首页', expenses: '费用 AA 分摊', chores: '清洁值日排班',
    items: '公共物品登记与提醒', pact: '室友公约管理',
  };

  /* ---------------- 账目计算（以“分”为单位避免浮点误差） ---------------- */
  function computeBalances() {
    const bal = {};
    MOCK.members.forEach(m => (bal[m.id] = 0));
    state.expenses.forEach(e => {
      const totalC = Math.round(e.amount * 100);
      const n = e.splitAmong.length;
      const base = Math.floor(totalC / n);
      const rem = totalC - base * n; // 余数分摊给前 rem 人
      e.splitAmong.forEach((id, i) => { bal[id] -= base + (i < rem ? 1 : 0); });
      bal[e.payerId] += totalC;
    });
    return bal;
  }

  function settlePlan() {
    const bal = computeBalances();
    const debtors = [], creditors = [];
    MOCK.members.forEach(m => {
      const v = bal[m.id];
      if (v <= -1) debtors.push({ id: m.id, v: -v });
      else if (v >= 1) creditors.push({ id: m.id, v });
    });
    debtors.sort((a, b) => b.v - a.v);
    creditors.sort((a, b) => b.v - a.v);
    const plan = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const amt = Math.min(debtors[i].v, creditors[j].v);
      plan.push({ from: debtors[i].id, to: creditors[j].id, amt });
      debtors[i].v -= amt; creditors[j].v -= amt;
      if (debtors[i].v <= 0) i++;
      if (creditors[j].v <= 0) j++;
    }
    return plan;
  }

  const monthTotal = () => state.expenses.reduce((s, e) => s + e.amount, 0);
  const lowItems = () => state.items.filter(i => i.stock <= i.threshold);

  /* ---------------- 通用 UI ---------------- */
  let toastTimer = null;
  function toast(msg, type = 'ok') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 2400);
  }

  function pushActivity(icon, text) {
    state.activities.unshift({ icon, text, time: '刚刚' });
  }

  function statCard(icon, label, value, sub, tone = '') {
    return `
      <div class="card stat-card ${tone}">
        <div class="stat-icon">${icon}</div>
        <div class="stat-body">
          <div class="stat-label">${label}</div>
          <div class="stat-value">${value}</div>
          <div class="stat-sub">${sub}</div>
        </div>
      </div>`;
  }

  /* ============================================================
   * 首页（导航页 + 看板）
   * ============================================================ */
  function renderHome() {
    const bal = computeBalances();

      { route: 'expenses', icon: '💰', color: '#f59e0b', name: '费用 AA 分摊', desc: '记一笔公共开销，自动均摊、债务确认，月底一键给出最少转账结算方案。', mini: `本月已记 ${state.expenses.length} 笔 · 总支出 ${fmtA(monthTotal())}` },

      { route: 'pact', icon: '📜', color: '#8b5cf6', name: '室友公约管理', desc: '在线共创、签署留痕、修订投票，让口头约定变成有据可依的“基本法”。', mini: `${MOCK.pact.version} · 全员已签署 · 1 个提案投票中` },

    return `
      <section class="hero card">
        <div>

        </div>
        <div class="hero-members">${MOCK.members.map(m => avatar(m, 'avatar-lg')).join('')}</div>
      </section>

      <div class="stat-row">
        ${myStat}${choreStat}${itemStat}${pactStat}
      </div>

      <h3 class="section-title">功能模块</h3>
      <div class="module-grid">
        ${modules.map(m => `
          <div class="card module-card" data-goto="${m.route}" role="button" tabindex="0" style="--mc:${m.color}">
            <div class="module-head">
              <span class="module-icon">${m.icon}</span>
              <span class="module-name">${m.name}</span>
              <span class="module-arrow">→</span>
            </div>
            <p class="module-desc">${m.desc}</p>
            <div class="module-mini">${m.mini}</div>
          </div>`).join('')}
      </div>

      <h3 class="section-title">最近动态</h3>
      <section class="card activity-card">
        <ul class="activity-list">
          ${state.activities.slice(0, 8).map(a => `
            <li><span class="activity-icon">${a.icon}</span><span class="activity-text">${esc(a.text)}</span><span class="activity-time">${a.time}</span></li>`).join('')}
        </ul>
      </section>`;
  }

  /* ============================================================
   * 模块一：费用 AA 分摊
   * ============================================================ */
  function renderExpenses() {
    const bal = computeBalances();
    const my = bal[state.currentUserId];
    const plan = settlePlan();
    const avg = monthTotal() / MOCK.members.length;

    const balanceRows = MOCK.members.map(m => {

      ? plan.map(p => `
        <li class="settle-row">
          ${memberChip(p.from)}<span class="settle-arrow">➜</span>${memberChip(p.to)}
          <span class="settle-amt">${fmtC(p.amt)}</span>
        </li>`).join('')
      : '<li class="empty">账目已全部结清 🎉</li>';

    const catColors = { '房租': '#6366f1', '水电燃气': '#0ea5e9', '网费': '#14b8a6', '公共用品': '#f97316', '其他': '#94a3b8' };
    const rows = state.expenses.map(e => {
      const n = e.splitAmong.length;
      return `
        <tr>
          <td class="td-date">${e.date.slice(5)}</td>
          <td><span class="cat-badge" style="--cc:${catColors[e.category] || '#94a3b8'}">${e.category}</span>${e.tag ? `<span class="tag">${e.tag}</span>` : ''}</td>
          <td class="td-note">${esc(e.note)}</td>
          <td>${memberChip(e.payerId)}</td>
          <td class="td-num">${fmtA(e.amount)}</td>
          <td class="td-num text-muted">${fmtA(e.amount / n)} × ${n}人</td>
          <td><span class="badge ${e.status === '已确认' ? 'badge-ok' : 'badge-warn'}">${e.status}</span></td>
        </tr>`;
    }).join('');

    return `
      <div class="stat-row">
        ${statCard('🧾', '本月总支出', fmtA(monthTotal()), `共 ${state.expenses.length} 笔公共开销`)}
        ${statCard('👥', '人均支出', fmtA(avg), '按 4 位在住室友计算')}
        ${my >= 0
          ? statCard('🙋', '我的净额', `<span class="text-green">应收 ${fmtC(my)}</span>`, '等待室友按结算建议转账')
          : statCard('🙋', '我的净额', `<span class="text-red">应付 ${fmtC(my)}</span>`, '结算后可在下方标记已结清', 'warn')}
      </div>

      <div class="cols-2">
        <section class="card">
          <h3 class="card-title">成员结余</h3>
          <ul class="balance-list">${balanceRows}</ul>
          <p class="card-foot">结余 = 累计垫付 − 累计应摊，实时计算</p>
        </section>
        <section class="card">
          <h3 class="card-title">结算建议 <span class="card-title-sub">最少 ${plan.length} 笔转账结清</span></h3>
          <ul class="settle-list">${planRows}</ul>
          <button class="btn btn-outline btn-block" data-action="settle-demo">线下转账后，一键标记全部已结清（演示）</button>
        </section>
      </div>

      <section class="card">
        <h3 class="card-title">记一笔公共开销</h3>
        <form id="expense-form" class="expense-form">
          <div class="form-grid">
            <label class="field">
              <span>金额（元）*</span>
              <input type="number" name="amount" min="0.01" step="0.01" placeholder="如 45.90" required />
            </label>
            <label class="field">
              <span>类别</span>
              <select name="category">${MOCK.expenseCategories.map(c => `<option>${c}</option>`).join('')}</select>
            </label>
            <label class="field">
              <span>付款人</span>
              <select name="payer">${MOCK.members.map(m => `<option value="${m.id}" ${m.id === state.currentUserId ? 'selected' : ''}>${m.avatar} ${m.name}</option>`).join('')}</select>
            </label>
            <label class="field field-wide">
              <span>备注</span>
              <input type="text" name="note" placeholder="如：九月电费 / 补货纸巾洗衣液" />
            </label>
          </div>
          <div class="field">
            <span>参与分摊（默认全员均摊，可取消勾选）</span>
            <div class="split-checks">
              ${MOCK.members.map(m => `
                <label class="check-chip">
                  <input type="checkbox" name="split" value="${m.id}" checked />
                  ${avatar(m)} ${m.name}
                </label>`).join('')}
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">＋ 记一笔并自动分摊</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h3 class="card-title">账单明细 <span class="card-title-sub">2026 年 9 月</span></h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>日期</th><th>类别</th><th>备注</th><th>付款人</th><th class="td-num">金额</th><th class="td-num">人均</th><th>状态</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>`;
  }

  /* ============================================================
   * 模块二：清洁值日排班
   * ============================================================ */
  function renderChores() {
    const statusBadge = s =>
      s === 'done' ? '<span class="badge badge-ok">✔ 已完成</span>'
      : s === 'overdue' ? '<span class="badge badge-danger">✖ 已逾期</span>'
      : '<span class="badge badge-warn">待完成</span>';

    const todayList = state.chores.filter(c => c.date === MOCK.today);
    const todayHtml = todayList.map(c => {
      const m = memberById(c.memberId);
      const btn = c.status === 'done'
        ? `<button class="btn btn-sm btn-outline" data-action="toggle-chore" data-id="${c.id}">撤销打卡</button>`
        : `<button class="btn btn-sm btn-primary" data-action="toggle-chore" data-id="${c.id}">完成打卡 ✔</button>`;
      return `<li class="chore-row">${avatar(m)}<span class="chore-task">${c.task}</span>${memberChip(c.memberId)}${statusBadge(c.status)}${btn}</li>`;
    }).join('') || '<li class="empty">今天没有值日任务</li>';

    const dates = [...new Set(state.chores.map(c => c.date))];
    const weekRows = dates.map(d => {
      const items = state.chores.filter(c => c.date === d);
      const isToday = d === MOCK.today;
      return items.map((c, idx) => `
        <tr class="${isToday ? 'row-today' : ''}">
          ${idx === 0 ? `<td class="td-date" rowspan="${items.length}">${d.slice(5)} ${items[0].weekday}${isToday ? '<span class="badge badge-today">今天</span>' : ''}</td>` : ''}
          <td>${c.task}<span class="freq">${c.freq}</span></td>
          <td>${memberChip(c.memberId)}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${c.status === 'done'
            ? '<span class="text-muted">已留痕</span>'
            : `<button class="btn btn-sm btn-outline" data-action="toggle-chore" data-id="${c.id}">打卡</button>`}</td>
        </tr>`).join('');
    }).join('');

    const stats = MOCK.members.map(m => {
      const assigned = state.chores.filter(c => c.memberId === m.id);
      const done = assigned.filter(c => c.status === 'done').length;
      const overdue = assigned.filter(c => c.status === 'overdue').length;
      const pct = assigned.length ? Math.round(done / assigned.length * 100) : 0;
      return { m, total: assigned.length, done, overdue, pct };
    });

    return `
      <div class="cols-2">
        <section class="card card-accent">
          <h3 class="card-title">📅 今日值日 <span class="card-title-sub">${MOCK.todayLabel}</span></h3>
          <ul class="chore-list">${todayHtml}</ul>
        </section>
        <section class="card">
          <h3 class="card-title">🔄 轮转规则</h3>
          <div class="rotation">
            ${MOCK.rotationOrder.map((id, i) => `
              <span class="rot-item">${memberChip(id)}${i < MOCK.rotationOrder.length - 1 ? '<span class="rot-arrow">→</span>' : ''}</span>`).join('')}
            <span class="rot-arrow">↻</span>
          </div>
          <p class="rule-text">「倒垃圾」每日按轮转顺序自动排班；周期任务（厨房 / 卫生间 / 客厅 / 大扫除）按周轮转。请假可发起换班，对方确认后生效并留痕。</p>
          <div class="fair-stats">
            ${stats.map(s => `
              <div class="fair-row">
                ${avatar(s.m)}
                <span class="fair-name">${s.m.name}</span>
                <div class="bar"><div class="bar-fill ${s.pct >= 60 ? 'ok' : 'warn'}" style="width:${s.pct}%"></div></div>
                <span class="fair-num">${s.done}/${s.total}${s.overdue ? ` <em class="text-red">逾期${s.overdue}</em>` : ''}</span>
              </div>`).join('')}
          </div>
          <p class="card-foot">本周完成 / 分配任务数 —— 用数据代替“感觉总是我在打扫”</p>
        </section>
      </div>

      <section class="card">
        <h3 class="card-title">本周排班表 <span class="card-title-sub">09-07 ~ 09-13</span></h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>日期</th><th>任务</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>${weekRows}</tbody>
          </table>
        </div>
      </section>`;
  }

  /* ============================================================
   * 模块三：公共物品登记与提醒
   * ============================================================ */
  function renderItems() {
    const lows = lowItems();
    const alertHtml = lows.length
      ? `<div class="alert alert-warn">⚠️ <b>${lows.length} 件物品库存告急：</b>${lows.map(i => `${i.name}（剩 ${i.stock}${i.unit}）`).join('、')} —— 已推送提醒至全体室友，补货后可一键转为公共开销。</div>`
      : '<div class="alert alert-ok">✨ 所有公共物品库存充足</div>';

    const cards = state.items.map(it => {
      const level = it.stock === 0 ? 'out' : it.stock <= it.threshold ? 'low' : 'ok';
      const badge = level === 'out' ? '<span class="badge badge-danger">已用完</span>'
        : level === 'low' ? '<span class="badge badge-danger">告急</span>'
        : '<span class="badge badge-ok">充足</span>';
      const pct = Math.min(100, Math.round(it.stock / (it.threshold * 2) * 100));
      return `
        <div class="card item-card">
          <div class="item-head">
            <span class="item-icon">${it.icon}</span>
            <div class="item-title">
              <div class="item-name">${it.name}</div>
              <div class="item-loc">📍 ${it.location}</div>
            </div>
            ${badge}
          </div>
          <div class="item-stock">库存 <b class="${level === 'ok' ? '' : 'text-red'}">${it.stock}</b> ${it.unit} <span class="text-muted">· 阈值 ${it.threshold}${it.unit}</span></div>
          <div class="bar"><div class="bar-fill ${level === 'ok' ? 'ok' : level === 'low' ? 'warn' : ''}" style="width:${pct}%"></div></div>
          <div class="item-actions">
            <button class="btn btn-sm btn-outline" data-action="consume" data-id="${it.id}">取用 −1</button>
            <button class="btn btn-sm btn-primary" data-action="restock" data-id="${it.id}">补货 +5</button>
          </div>
        </div>`;
    }).join('');

    const logs = state.itemLogs.slice(0, 10).map(l => `
      <tr>
        <td class="td-date">${l.time}</td>
        <td>${l.itemName}</td>
        <td><span class="badge ${l.type === '补货' ? 'badge-ok' : 'badge-info'}">${l.type}</span></td>
        <td class="td-num ${l.qty > 0 ? 'text-green' : 'text-red'}">${l.qty > 0 ? '+' : ''}${l.qty}</td>
        <td>${memberChip(l.byId)}</td>
        <td class="td-num">${l.cost != null ? fmtA(l.cost) : '<span class="text-muted">—</span>'}</td>
        <td>${l.linked ? `<span class="tag">${l.linked}</span>` : '<span class="text-muted">—</span>'}</td>
      </tr>`).join('');

    return `
      ${alertHtml}
      <div class="item-grid">${cards}</div>
      <section class="card">
        <h3 class="card-title">最近流水 <span class="card-title-sub">补货支出可一键转为「费用AA分摊」账单</span></h3>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>时间</th><th>物品</th><th>类型</th><th class="td-num">数量</th><th>操作人</th><th class="td-num">金额</th><th>关联</th></tr></thead>
            <tbody>${logs}</tbody>
          </table>
        </div>
      </section>`;
  }

  /* ============================================================
   * 模块四：室友公约管理
   * ============================================================ */
  function renderPact() {
    const p = MOCK.pact;
    const pr = state.proposal;
    const forCount = Object.values(pr.votes).filter(v => v === 'for').length + (pr.myVote === 'for' ? 1 : 0);
    const againstCount = Object.values(pr.votes).filter(v => v === 'against').length + (pr.myVote === 'against' ? 1 : 0);
    const total = forCount + againstCount;
    const forPct = total ? Math.round(forCount / total * 100) : 0;

    const clauses = p.clauses.map((c, i) => `
      <li class="clause"><b>${i + 1}. ${c.title}</b><p>${c.text}</p></li>`).join('');

    const signs = p.signs.map(s => {
      const m = memberById(s.memberId);
      return `<div class="sign-card">${avatar(m, 'avatar-lg')}<div class="sign-name">${m.name}</div><div class="sign-time">✅ 已签署<br/>${s.time}</div></div>`;
    }).join('');

    const history = p.history.map(h => `
      <li class="timeline-item">
        <span class="timeline-dot"></span>
        <div><b>${h.version}</b> <span class="text-muted">· ${h.date} · ${memberById(h.byId).name} 发布</span><p>${h.note}</p></div>
      </li>`).join('');

    const voteBtns = pr.myVote
      ? `<div class="voted">已投票：<b>${pr.myVote === 'for' ? '赞成 ✔' : '反对 ✖'}</b>（截止 ${pr.deadline}）</div>`
      : `<div class="vote-btns">
          <button class="btn btn-primary" data-action="vote" data-choice="for">👍 赞成</button>
          <button class="btn btn-outline" data-action="vote" data-choice="against">👎 反对</button>
        </div>`;

    return `
      <section class="card pact-head">
        <div>
          <h2>📜 ${p.title} <span class="badge badge-info">${p.version}</span></h2>
          <p class="hero-sub">${p.effective} 生效 · 签署 ${p.signs.length}/${MOCK.members.length} · 修订需投票通过</p>
        </div>
        <button class="btn btn-outline" data-action="pact-export">导出公约 PDF（演示）</button>
      </section>

      <div class="cols-2">
        <section class="card">
          <h3 class="card-title">公约条款</h3>
          <ol class="clause-list">${clauses}</ol>
        </section>
        <div class="stack">
          <section class="card card-accent">
            <h3 class="card-title">🗳️ 进行中的修订提案 <span class="card-title-sub">截止 ${pr.deadline}</span></h3>
            <p class="proposal-title">「${pr.title}」</p>
            <p class="text-muted small">提案人：${memberById(pr.proposerId).name} · ${pr.rule}</p>
            <div class="vote-bar-wrap">
              <div class="vote-bar"><div class="vote-for" style="width:${forPct}%"></div></div>
              <div class="vote-nums"><span class="text-green">赞成 ${forCount}</span><span class="text-red">反对 ${againstCount}</span></div>
            </div>
            ${voteBtns}
          </section>
          <section class="card">
            <h3 class="card-title">签署记录 <span class="card-title-sub">人 + 时间，永久留痕</span></h3>
            <div class="sign-grid">${signs}</div>
          </section>
        </div>
      </div>

      <section class="card">
        <h3 class="card-title">修订历史</h3>
        <ul class="timeline">${history}</ul>
      </section>`;
  }

  /* ============================================================
   * 交互行为
   * ============================================================ */
  const actions = {
    'toggle-chore'(btn) {
      const c = state.chores.find(x => x.id === btn.dataset.id);
      if (!c) return;
      if (c.status === 'done') {
        c.status = c.date < MOCK.today ? 'overdue' : 'pending';
        toast('已撤销打卡');
      } else {
        c.status = 'done';
        pushActivity('✅', `${me().name} 完成值日打卡：${c.task}`);
        toast(`打卡成功 ✔「${c.task}」已记录 ${MOCK.todayLabel}`);
      }
    },
    'consume'(btn) {
      const it = state.items.find(x => x.id === btn.dataset.id);
      if (!it) return;
      if (it.stock <= 0) { toast(`「${it.name}」已用完，请先补货`, 'err'); return; }
      it.stock -= 1;
      state.itemLogs.unshift({ time: '刚刚', itemName: it.name, type: '消耗', qty: -1, byId: state.currentUserId, cost: null, linked: null });
      if (it.stock === it.threshold) {
        pushActivity('⚠️', `系统提醒：「${it.name}」已低于库存阈值，全员收到补货提醒`);
        toast(`已取用。「${it.name}」库存告急，已提醒全员补货 ⚠️`, 'warn');
      } else {
        toast(`已登记取用：${it.name} −1`);
      }
    },
    'restock'(btn) {
      const it = state.items.find(x => x.id === btn.dataset.id);
      if (!it) return;
      it.stock += 5;
      state.itemLogs.unshift({ time: '刚刚', itemName: it.name, type: '补货', qty: 5, byId: state.currentUserId, cost: null, linked: '待录入金额' });
      pushActivity('📦', `${me().name} 补货登记：${it.name} +5`);
      toast(`补货成功：${it.name} +5，可录入金额转为公共开销`);
    },
    'vote'(btn) {
      const pr = state.proposal;
      if (pr.myVote) { toast('你已经投过票了'); return; }
      pr.myVote = btn.dataset.choice;
      pushActivity('🗳️', `${me().name} 参与了公约修订提案投票`);
      toast(`投票成功：${pr.myVote === 'for' ? '赞成 👍' : '反对 👎'}`);
    },
    'settle-demo'() {
      toast('演示环境：正式版将记录结清凭证并锁定账单', 'warn');
    },
    'pact-export'() {
      toast('演示环境：正式版将导出含签署记录的 PDF', 'warn');
    },
  };

  function onSubmitExpense(e) {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const amount = parseFloat(fd.get('amount'));
    if (!amount || amount <= 0) { toast('请输入正确金额', 'err'); return; }
    const split = fd.getAll('split');
    if (!split.length) { toast('请至少选择一位分摊人', 'err'); return; }
    const category = fd.get('category');
    const note = (fd.get('note') || '').trim() || category;
    state.expenses.unshift({
      id: 'e' + (++state.idSeq),
      date: MOCK.today,
      category, note, amount,
      payerId: fd.get('payer'),
      splitAmong: split,
      status: '待确认',
    });
    pushActivity('💰', `${me().name} 记了一笔：${category}「${note}」${fmtA(amount)}（${split.length}人均摊）`);
    toast(`已记录 ${fmtA(amount)}，自动分摊给 ${split.length} 人 ✔`);
    renderRoute();
  }

  /* ============================================================
   * 路由与初始化
   * ============================================================ */
  const RENDERERS = { home: renderHome, expenses: renderExpenses, chores: renderChores, items: renderItems, pact: renderPact };

  function renderRoute() {
    $('#page-title').textContent = TITLES[state.route] || '首页';
    document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.route === state.route));
    $('#page').innerHTML = (RENDERERS[state.route] || renderHome)();
    const form = $('#expense-form');
    if (form) form.addEventListener('submit', onSubmitExpense);
    window.scrollTo({ top: 0 });
  }

  function onHashChange() {
    const r = (location.hash || '#/home').replace(/^#\//, '');
    state.route = RENDERERS[r] ? r : 'home';
    renderRoute();
  }

  function init() {
    $('#today-chip').textContent = '📅 ' + MOCK.todayLabel;

    // 主内容区事件委托（按钮 / 模块卡片）
    $('#page').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (btn) {
        const fn = actions[btn.dataset.action];
        if (fn) fn(btn);
        if (['toggle-chore', 'consume', 'restock', 'vote'].includes(btn.dataset.action)) renderRoute();
        return;
      }
      const card = e.target.closest('[data-goto]');
      if (card) location.hash = '#/' + card.dataset.goto;
    });

    // 键盘可达性：模块卡片回车跳转
    $('#page').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const card = e.target.closest('[data-goto]');
        if (card) location.hash = '#/' + card.dataset.goto;
      }
    });

    window.addEventListener('hashchange', onHashChange);
    onHashChange();
  }

  return { init };
})();

document.addEventListener('DOMContentLoaded', App.init);
  </script>
</body>
</html>
