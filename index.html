<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合租生活管家</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">🏠</span>
        <span class="logo-text">合租生活管家</span>
      </div>
      <nav class="nav">
        <a class="nav-item" href="#/home" data-route="home">
          <span class="nav-icon">🏡</span><span>首页</span>
        </a>
        <a class="nav-item" href="#/expenses" data-route="expenses">
          <span class="nav-icon">💰</span><span>费用AA分摊</span>
        </a>
        <a class="nav-item" href="#/chores" data-route="chores">
          <span class="nav-icon">🧹</span><span>清洁值日排班</span>
        </a>
        <a class="nav-item" href="#/items" data-route="items">
          <span class="nav-icon">🧻</span><span>公共物品</span>
        </a>
        <a class="nav-item" href="#/pact" data-route="pact">
          <span class="nav-icon">📜</span><span>室友公约</span>
          <span class="nav-dot" title="有提案投票中"></span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="house-chip">🏘️ 阳光里3栋1202 · 4位室友</div>
        <div class="demo-chip">当前为演示 Mock 数据</div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">首页</h1>
        <div class="topbar-right">
          <span class="today-chip" id="today-chip">📅 2026-09-12 周六</span>
          <span class="user-chip">
            <span class="avatar" style="background:#f59e0b26">🐻</span>
            <span>小北 <em>· 管理员</em></span>
          </span>
        </div>
      </header>
      <div class="page" id="page"><!-- 由 app.js 渲染 --></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
